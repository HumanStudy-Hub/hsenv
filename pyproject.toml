[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsenv"
version = "0.8.1"
description = "HumanStudy sandbox engine: run protocol v1 studies (protocol.json) step by step, score runs against the paper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }   # the same licence as HumanStudy-Bench (its LICENSE file); see LICENSE
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]
# Runtime is the standard library only. Keep it that way: desktop, web, cloud and Bench all vendor this.
dependencies = []

[project.optional-dependencies]
# a second, independent draft-2020-12 validator for cross-checking hsenv.schema_check (not needed at runtime)
jsonschema = ["jsonschema>=4.18"]
# the one PDF extractor release projections and rehydration use (hsenv.distribution.pdfium_extractor; DESIGN §3.6)
pdf = ["pypdfium2"]
test = ["pytest>=7"]
dev = ["jsonschema>=4.18", "pytest>=7"]

[project.scripts]
hsenv-schema-check = "hsenv.schema_check:main"
hsenv-check = "hsenv.checks:main"
hsenv-capabilities = "hsenv.capabilities:main"
hsenv-score = "hsenv.score:main"
hsenv-serve-http = "hsenv.serve_http:main"
hsenv-serve-mcp = "hsenv.serve_mcp:main"

[tool.setuptools]
# hsenv/schema/*.json ships inside the wheel as the hsenv.schema package data (found with importlib.resources)
packages = ["hsenv", "hsenv.schema"]
package-dir = { "hsenv" = "hsenv", "hsenv.schema" = "schema" }
include-package-data = false

[tool.setuptools.package-data]
"hsenv.schema" = ["*.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
